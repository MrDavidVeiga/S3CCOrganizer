[package]
name = "s3cc-organizer"
version = "0.1.0"
edition = "2021"

[lib]
name = "s3cc_organizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
byteorder = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
