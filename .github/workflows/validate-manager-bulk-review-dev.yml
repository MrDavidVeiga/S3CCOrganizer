name: Validate Manager Planner and Bulk Review

# Temporary branch-only validation; never generates a portable build or release.
on:
  push:
    branches:
      - fix/planner-root-bulk-review-20261008
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-manager-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Validate frontend
        run: |
          npm install
          npm install --no-save --include=optional @rollup/rollup-win32-x64-msvc
          node --check src/app.js
          node scripts/verify-fluent-foundation.mjs
          npm run build
      - name: Restore Tauri app icon for Rust compilation
        shell: pwsh
        run: |
          $encoded = (Get-Content -LiteralPath "src-tauri/icons/manager-icon.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("src-tauri/icons/manager-icon.png", [Convert]::FromBase64String($encoded))
          npm run tauri icon src-tauri/icons/manager-icon.png
      - name: Run Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
