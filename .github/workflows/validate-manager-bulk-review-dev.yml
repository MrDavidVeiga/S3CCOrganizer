name: Validate Manager Planner and Bulk Review

# Temporary branch-only validation; never generates a portable build or release.
on:
  push:
    branches:
      - fix/planner-root-bulk-review-20261008
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-manager-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - name: Validate frontend
        run: |
          npm install
          node --check src/app.js
          node scripts/verify-fluent-foundation.mjs
          npm run build
      - name: Restore Tauri app icon for Rust compilation
        run: |
          python3 -c "import base64,pathlib; p=pathlib.Path('src-tauri/icons/manager-icon.png'); p.write_bytes(base64.b64decode(pathlib.Path('src-tauri/icons/manager-icon.b64').read_text().strip()))"
          npm run tauri icon src-tauri/icons/manager-icon.png
      - name: Run Rust regression tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
