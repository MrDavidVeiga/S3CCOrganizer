name: Validate Fluent foundation

on:
  push:
    branches:
      - feature/winui3-full-fidelity
    paths:
      - "src/**"
      - "index.html"
      - "scripts/verify-fluent-foundation.mjs"
      - "scripts/test-fluent-interactions.mjs"
      - "scripts/test-fluent-listview.mjs"
      - "scripts/test-fluent-feedback.mjs"
      - "scripts/test-fluent-chrome.mjs"
      - "scripts/test-fluent-buttons.mjs"
      - ".github/workflows/validate-fluent-foundation.yml"
      - "package.json"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install
      - name: Verify Fluent foundation
        run: node scripts/verify-fluent-foundation.mjs
      - name: Install simulated DOM testing dependency
        run: npm install --no-save jsdom@26
      - name: Test Fluent interactions
        run: node scripts/test-fluent-interactions.mjs
      - name: Test Fluent virtual ListViews and scrollbars
        run: node scripts/test-fluent-listview.mjs
      - name: Test Fluent feedback and progress
        run: node scripts/test-fluent-feedback.mjs
      - name: Test combined Fluent SearchBox Expander ToolTip and window chrome
        run: node scripts/test-fluent-chrome.mjs
      - name: Test WinUI Button geometry and theme invariants
        run: node scripts/test-fluent-buttons.mjs
      - name: Build Vite frontend
        run: npm run build
