name: Validate scanner

on:
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - ".github/workflows/validate-scanner.yml"
  workflow_dispatch:

jobs:
  scanner-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdown
        if: github.event_name == 'workflow_dispatch'
        run: python -m pip install --disable-pip-version-check gdown

      - name: Try public Drive sample download
        id: sample_download
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: pwsh
        run: |
          gdown "https://drive.google.com/uc?id=1e-yd7iNRGn3Ae0trqXZDNn1xaFKhbGYg" -O sample-download.bin
          if (Test-Path sample-download.bin) {
            Get-Item sample-download.bin | Select-Object Name,Length
          }

      - name: Prepare sample packages
        id: sample_prepare
        if: github.event_name == 'workflow_dispatch' && steps.sample_download.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/prepare_sample.py sample-download.bin sample-packages
          Get-ChildItem sample-packages | Select-Object Name,Length

      - name: Scan real sample packages
        if: github.event_name == 'workflow_dispatch' && steps.sample_prepare.outcome == 'success'
        shell: pwsh
        run: |
          cargo run --manifest-path src-tauri/Cargo.toml --bin scan_sample -- sample-packages en | Tee-Object -FilePath sample-scan.json
